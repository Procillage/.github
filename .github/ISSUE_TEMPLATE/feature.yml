name: Feature
description: Propose new functionality or improvements.
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What problem are we solving, and why?
      placeholder: Explain the problem or opportunity.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should the feature accomplish?
      placeholder: Describe the expected behavior or result.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true for this feature to be complete?
      placeholder: |
        - [ ] Expected behavior works
        - [ ] Relevant checks pass
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References and constraints
      description: Optional documentation, designs, dependencies, or technical constraints.
      placeholder: Links or additional context.
    validations:
      required: false
