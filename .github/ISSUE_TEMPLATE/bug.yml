name: Bug
description: Report unexpected or incorrect behavior.
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, secrets, or private customer data.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is not working? Include the affected product or area.
      placeholder: Describe the current behavior.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include steps when the problem can be reproduced.
      placeholder: |
        1. Open ...
        2. Perform ...
        3. Observe ...
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should happen instead?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment and evidence
      description: Optional versions, browser, logs, screenshots, or related links.
      placeholder: Add relevant details, without sensitive information.
    validations:
      required: false
